<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Gender reveal</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #f7f4f1;
      --bg2: #e7eef6;
      --bg3: #f3e7ee;
      --card: #fae6d2;
      --yes: #D8A7B1;
      --yesHover: #ff3b7a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 25% 25%, rgba(0, 120, 255, 0.45), transparent 60%),
        radial-gradient(circle at 75% 30%, rgba(255, 60, 140, 0.45), transparent 60%),
        linear-gradient(135deg, #0078ff, #ff3c8c);
      font-family: system-ui, sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(720px, 92vw);
      padding: 16px 12px;
      background: var(--card);
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
      max-height: 95vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .art {
      max-width: 100%;
      max-height: 30vh;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(20px, 3.5vw, 36px);
      margin: 10px 0 18px;
      white-space: nowrap;
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 150px;
      touch-action: none;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      user-select: none;
      transition: transform .12s ease, background .12s ease;
    }

    #yesBtn { left: 18%; background: var(--yes); color: #fff; }
    #yesBtn:hover { background: var(--yesHover); }

    #noBtn { left: 62%; background: #7DA0CA; color: #fff; }

    .hint { margin-top: 10px; font-size: 13px; opacity: .7; }

    .result {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 18px;
    }

    .result h2 {
      font-size: clamp(30px, 4.5vw, 46px);
      margin: 10px 0;
    }
  </style>
</head>

<body>
<canvas id="confettiCanvas"></canvas>

<main class="card">
  <svg class="art" viewBox="0 0 320 260">
    <ellipse cx="160" cy="235" rx="75" ry="12" fill="#000" opacity="0.08"/>
    <ellipse cx="160" cy="125" rx="70" ry="60" fill="#c58a4a"/>
    <path d="M160 185 C150 165 120 170 120 195 C120 220 160 230 160 230 C160 230 200 220 200 195 C200 170 170 165 160 185 Z" fill="#ff3b7a"/>
  </svg>

  <h1 id="question">Hva tror du kjønnet er?</h1>

  <section class="button-zone" id="zone">
    <button id="yesBtn">Jente</button>
    <button id="noBtn">Gutt</button>
  </section>

  <div class="hint" id="hint">VELG DET DU TROR</div>

  <section class="result" id="result">
    <h2>YEY! 🎉</h2>
  </section>
</main>

<script>
const zone = document.getElementById("zone");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const result = document.getElementById("result");
const hint = document.getElementById("hint");
const question = document.getElementById("question");

/* ---------- CONFETTI ---------- */
const canvas = document.getElementById("confettiCanvas");
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
}
resize();
addEventListener("resize", resize);

const confetti = window.confetti.create(canvas, { resize: false });

function fireConfetti() {
  const end = Date.now() + 1500;
  (function frame() {
    confetti({ particleCount: 10, spread: 80, origin: { x: Math.random(), y: Math.random()*0.3 } });
    if (Date.now() < end) requestAnimationFrame(frame);
  })();
}

/* ---------- YES GROW (kun ved NO-trykk) ---------- */
let yesScale = 1;
let yesCanGrow = false;
let lastGrow = 0;

setTimeout(() => {
  yesCanGrow = true;
}, 1500);

function growYes() {
  if (!yesCanGrow) return;

  const now = Date.now();
  if (now - lastGrow < 300) return;
  lastGrow = now;

  yesScale = Math.min(2.2, yesScale + 0.06);
  yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
}

/* ---------- NO MOVEMENT ---------- */
function clamp(n, min, max) {
  return Math.max(min, Math.min(max, n));
}

function moveNo(x, y) {
  const z = zone.getBoundingClientRect();
  const b = noBtn.getBoundingClientRect();

  let dx = (b.left + b.width/2) - x;
  let dy = (b.top + b.height/2) - y;
  let mag = Math.hypot(dx, dy) || 1;

  dx /= mag; dy /= mag;

  let newLeft = (b.left - z.left) + dx * 140;
  let newTop  = (b.top - z.top) + dy * 140;

  noBtn.style.left = clamp(newLeft, 0, z.width - b.width) + "px";
  noBtn.style.top = clamp(newTop, 0, z.height - b.height) + "px";
  noBtn.style.transform = "none";
}

zone.addEventListener("mousemove", e => moveNo(e.clientX, e.clientY));

zone.addEventListener("touchmove", e => {
  const t = e.touches[0];
  moveNo(t.clientX, t.clientY);
}, { passive: true });

/* ---------- NO CLICK = GROW YES ---------- */
noBtn.addEventListener("click", (e) => {
  e.preventDefault();
  growYes();
});

/* ---------- YES CLICK ---------- */
yesBtn.addEventListener("click", () => {
  zone.style.display = "none";
  hint.style.display = "none";
  question.style.display = "none";
  result.style.display = "flex";
  fireConfetti();
});
</script>
</body>
</html>
