<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Will you be my Valentine?</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #343fe3;
      --card: #fae6d2;
      --yes: #D8A7B1;
      --yesHover: #ff3b7a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 25% 50%, rgba(0, 120, 255, 0.35), transparent 60%),
        radial-gradient(circle at 75% 50%, rgba(255, 60, 140, 0.35), transparent 60%),
        linear-gradient(90deg, #8ec1fb 0%, #fc8fbd 100%);
      font-family: system-ui, sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(720px, 92vw);
      padding: 16px 12px;
      background: var(--card);
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
      max-height: 95vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .art {
      max-width: 100%;
      max-height: 30vh;
      height: auto;
      display: block;
      margin: 0 auto 10px;
    }

    h1 {
      font-size: clamp(20px, 3.5vw, 36px);
      margin: 10px 0 18px;
      white-space: nowrap;
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 150px;
      margin: 0 auto;
      touch-action: none;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
    }

    #yesBtn { left: 18%; background: var(--yes); color: #fff; }
    #noBtn { left: 62%; background: #7DA0CA; color: #fff; }

    .hint { margin-top: 10px; font-size: 13px; opacity: .7; }

    .result {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 18px;
    }

    .result h2 {
      font-size: clamp(30px, 4.5vw, 46px);
      margin: 10px 0;
    }

    /* 🔥 NYTT: container for bildene */
    .result-images {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .result-images img {
      max-width: 180px;
      width: 40%;
      height: auto;
      border-radius: 10px;
    }

  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">

    <svg class="art" viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="160" cy="235" rx="75" ry="12" fill="#000" opacity="0.08"/>
      <path d="M95 105 C70 95 70 60 105 65 C115 80 115 100 95 105 Z" fill="#8b5a2b"/>
      <path d="M225 105 C250 95 250 60 215 65 C205 80 205 100 225 105 Z" fill="#8b5a2b"/>
      <ellipse cx="160" cy="125" rx="70" ry="60" fill="#c58a4a"/>
      <ellipse cx="160" cy="155" rx="50" ry="30" fill="#e8b77a"/>
      <ellipse cx="160" cy="150" rx="12" ry="8" fill="#222"/>
      <path d="M160 158 L160 168" stroke="#5a3a1a" stroke-width="3"/>
      <path d="M160 168 Q150 175 140 168" stroke="#5a3a1a" stroke-width="3" fill="none"/>
      <path d="M160 168 Q170 175 180 168" stroke="#5a3a1a" stroke-width="3" fill="none"/>
      <ellipse cx="135" cy="120" rx="7" ry="9" fill="#222"/>
      <ellipse cx="185" cy="120" rx="7" ry="9" fill="#222"/>
      <circle cx="138" cy="118" r="2" fill="#fff"/>
      <circle cx="188" cy="118" r="2" fill="#fff"/>
      <ellipse cx="125" cy="200" rx="22" ry="16" fill="#b97a3d"/>
      <ellipse cx="195" cy="200" rx="22" ry="16" fill="#b97a3d"/>
      <path d="M160 185 C150 165 120 170 120 195 C120 220 160 230 160 230 C160 230 200 220 200 195 C200 170 170 165 160 185 Z" fill="#ff3b7a"/>
    </svg>

    <h1 id="question">Hva tror du kjønnet er?</h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn">Jente</button>
      <button id="noBtn">Gutt</button>
    </section>

    <div class="hint" id="hint">VELG DET DU TROR</div>

    <section class="result" id="result">
      <h2>HALLA! 🎉</h2>

      <!-- 🔥 NYTT: side-om-side bilder -->
      <div class="result-images">
        <img src="bilder/hand.jpeg" alt="bilde 1">
        <img src="bilder/kropp.jpeg" alt="bilde 2">
      </div>

    </section>

  </main>

</body>
</html>
